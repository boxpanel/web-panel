name: Test Build

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    tags:
      - 'test-*'
  workflow_dispatch:

jobs:
  test-build:
    name: Test Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.0'

    - name: Test Go build
      run: |
        cd backend
        go build -o web-panel ./cmd/main.go
        echo "Build successful!"
        ls -la web-panel