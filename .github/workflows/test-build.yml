name: Test Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Test Build Single Platform
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.0'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.2.0'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Build frontend
      run: |
        if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
          echo "Building frontend..."
          cd frontend
          npm ci
          npm run build
          mkdir -p ../backend/static
          if [ -d "dist" ]; then
            cp -r dist/* ../backend/static/
            echo "Frontend built successfully"
          fi
          cd ..
        fi

    - name: Build backend
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: 0
      run: |
        cd backend
        go build -ldflags "-s -w" -o web-panel ./cmd/main.go
        echo "Backend built successfully"
        ls -la web-panel