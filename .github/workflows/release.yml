name: Build and Release

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'latest'

jobs:
  build:
    name: Build for multiple platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.5'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.2.0'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Get version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

    - name: Build frontend
      shell: bash
      run: |
        if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
          echo "Building frontend..."
          cd frontend
          
          # Show Node.js and npm versions
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          
          # Install dependencies
          echo "Installing frontend dependencies..."
          npm ci
          
          # Build frontend
          echo "Building frontend..."
          npm run build
          
          # Ensure backend static directory exists
          mkdir -p ../backend/static
          
          # Copy built files to backend static directory
          if [ -d "dist" ]; then
            echo "Copying frontend build to backend/static..."
            cp -r dist/* ../backend/static/
            echo "Frontend built and copied to backend/static"
            echo "Static files:"
            ls -la ../backend/static/
          else
            echo "Error: dist directory not found after build"
            echo "Available directories:"
            ls -la .
            exit 1
          fi
          
          cd ..
        else
          echo "No frontend found, skipping frontend build..."
        fi

    - name: Build backend
      shell: bash
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        cd backend
        
        # Show Go version and environment
        echo "Go version: $(go version)"
        echo "GOOS: $GOOS"
        echo "GOARCH: $GOARCH"
        echo "CGO_ENABLED: $CGO_ENABLED"
        
        # Set binary name
        BINARY_NAME="web-panel"
        if [ "${{ matrix.os }}" = "windows" ]; then
          BINARY_NAME="web-panel.exe"
        fi
        echo "Building binary: $BINARY_NAME"
        
        # Build flags
        LDFLAGS="-s -w"
        LDFLAGS="$LDFLAGS -X 'main.Version=${{ steps.version.outputs.version }}'"
        LDFLAGS="$LDFLAGS -X 'main.BuildTime=${{ steps.version.outputs.build_time }}'"
        LDFLAGS="$LDFLAGS -X 'main.GitCommit=${{ steps.version.outputs.git_commit }}'"
        LDFLAGS="$LDFLAGS -X 'main.GitBranch=${{ steps.version.outputs.git_branch }}'"
        echo "LDFLAGS: $LDFLAGS"
        
        # Verify main.go exists
        if [ ! -f "./cmd/main.go" ]; then
          echo "Error: ./cmd/main.go not found"
          echo "Available files in cmd directory:"
          ls -la ./cmd/
          exit 1
        fi
        
        # Build
        echo "Starting Go build..."
        go build -ldflags "$LDFLAGS" -o "$BINARY_NAME" ./cmd/main.go
        
        # Verify binary was created
        if [ ! -f "$BINARY_NAME" ]; then
          echo "Error: Binary $BINARY_NAME was not created"
          exit 1
        fi
        
        echo "Binary built successfully: $BINARY_NAME"
        ls -la "$BINARY_NAME"
        
        # Create release directory
        RELEASE_DIR="web-panel-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
        mkdir -p "$RELEASE_DIR"
        
        # Copy binary
        mv "$BINARY_NAME" "$RELEASE_DIR/"
        
        # Copy config files
        if [ -f "config/app.yaml" ]; then
          mkdir -p "$RELEASE_DIR/config"
          cp config/app.yaml "$RELEASE_DIR/config/"
        elif [ -f "../config/app.yaml" ]; then
          mkdir -p "$RELEASE_DIR/config"
          cp ../config/app.yaml "$RELEASE_DIR/config/"
        fi
        
        # Copy static files
        if [ -d "static" ]; then
          cp -r static "$RELEASE_DIR/"
        fi
        
        # Copy documentation
        cp ../README.md "$RELEASE_DIR/" 2>/dev/null || true
        cp ../LICENSE "$RELEASE_DIR/" 2>/dev/null || true
        
        # Create startup scripts
        if [ "${{ matrix.os }}" = "windows" ]; then
          cat > "$RELEASE_DIR/start.bat" << 'EOF'
        @echo off
        echo Starting Web Panel...
        web-panel.exe
        pause
        EOF
        else
          cat > "$RELEASE_DIR/start.sh" << 'EOF'
        #!/bin/bash
        echo "Starting Web Panel..."
        ./web-panel
        EOF
          chmod +x "$RELEASE_DIR/start.sh"
        fi
        
        # Create package based on OS
        if [ "${{ matrix.os }}" = "windows" ]; then
          # Create zip package for Windows
          zip -r "$RELEASE_DIR.zip" "$RELEASE_DIR"
          PACKAGE_NAME="$RELEASE_DIR.zip"
        else
          # Create tar.gz package for Unix-like systems
          tar -czf "$RELEASE_DIR.tar.gz" "$RELEASE_DIR"
          PACKAGE_NAME="$RELEASE_DIR.tar.gz"
        fi
        
        # Move to artifacts directory
        mkdir -p ../artifacts
        mv "$PACKAGE_NAME" ../artifacts/
        
        echo "Package created: $PACKAGE_NAME"

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: web-panel-${{ matrix.os }}-${{ matrix.arch }}
        path: artifacts/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Prepare release assets
      shell: bash
      run: |
        mkdir -p release-assets
        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
        find artifacts -name "*.zip" -exec cp {} release-assets/ \;
        
        # Generate checksums
        cd release-assets
        if ls *.tar.gz 1> /dev/null 2>&1; then
          sha256sum *.tar.gz >> checksums.txt
        fi
        if ls *.zip 1> /dev/null 2>&1; then
          sha256sum *.zip >> checksums.txt
        fi
        cd ..
        
        echo "Release assets:"
        ls -la release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release-assets/*.tar.gz
          release-assets/*.zip
          release-assets/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update latest release info
      shell: bash
      run: |
        echo "Release ${{ steps.version.outputs.version }} created successfully!"
        echo "Download URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
        echo "Assets:"
        ls -la release-assets/